# potcawe_functions.toml - Manual corrections for the analyzer (default.xex): functions it missed,
# [[switch_tables]] the codegen mistranslates and [[midasm_hook]]s into src/. See GRAWRecomp's
# yeti_functions.toml for examples of each.

# The C runtime's setjmp and longjmp (sub_8249A2B0, sub_8249A380). The codegen turns calls to them into the
# host's setjmp and longjmp, keyed by the guest jmp_buf. Translated as plain functions, longjmp restores the
# registers and returns to its caller instead of jumping: Lua's luaD_throw then went on into its path for an
# uncaught error and called exit(), so a script error the game catches closed the game
# (docs/script-errors.md). Lua uses them for every protected call; two other libraries use them too (around
# 0x824AD000 and 0x824C0000).
setjmp_address = 0x8249A2B0
longjmp_address = 0x8249A380

[functions]
# Branch (b) targets that the automatic analysis did not assign to any function. All are small
# functions reached only through tail calls: getters that return the address of a static object
# (lis r11 / addi r3,r11,X / blr) and one this-adjusting thunk (addi r3,r3,4 / b).
0x820C0900 = {}   # branched to from 0x820C166C
0x820C1678 = {}   # branched to from 0x820C330C
0x820CBEC8 = {}   # branched to from 0x820CBF9C
0x820E7990 = {}   # branched to from 0x820EB9A4
0x8210F288 = {}   # branched to from 0x8210F534
0x82188348 = {}   # branched to from 0x821888AC
0x821888B0 = {}   # branched to from 0x82189574
0x822608F8 = {}   # branched to from 0x822614CC
0x822614E0 = {}   # branched to from 0x82263344
0x82265618 = {}   # branched to from 0x822661DC
0x824FC588 = {}   # branched to from 0x824FF124 (this-adjusting thunk)

# Getters placed right after a this-adjusting thunk that ends in a branch to the next instruction
# (addi r3,r3,X / b +4). The analyzer folds the getter into the thunk as a label, but the getter is
# also a vtable entry of its own and is called through it ("Call to invalid or unregistered function"
# at the first boot). All code pointers in .rdata/.data were checked against the function table:
# these are the only vtable entries missing (the rest are __try/__except scope-table targets).
0x820FAEB8 = {}   # after the thunk at 0x820FAEB0; vtable entry at 0x8203BB08
0x820FB500 = {}   # after the thunk at 0x820FB4F8; vtable entry at 0x8203B448

# The game's waits for the GPU without spinning (src/gpu_wait.cpp): the D3D library waits for the
# command processor in six loops (ring space, fences, pending swaps, write-backs), each opened by
# sub_822AF458 and calling the hang check sub_822AF608 on every iteration; on PC they kept the
# render thread at 100 % of a core. potcawe_gpu_wait_sleep_us = 0 disables it.
[[midasm_hook]]
address = 0x822AF458   # stw r4,0(r3) (entry of sub_822AF458: a wait starts)
name = "PotcaweGpuWaitBeginHook"
[[midasm_hook]]
address = 0x822AF608   # mflr r12 (entry of sub_822AF608: every iteration of a wait)
name = "PotcaweGpuWaitSpinHook"

# 60 FPS (src/framerate.cpp): the Direct3D library reads the D3DRS_PRESENTINTERVAL render state
# (device+13444, set to 2 by the game's renderer) in sub_822B58B0 and encodes it into the swap
# descriptor for the vblank callback; the hook turns 2 into 1 when potcawe_60fps is on.
[[midasm_hook]]
address = 0x822B5968   # cmplwi r10,0 (after lwz r10,13444(r31) in sub_822B58B0)
name = "PotcawePresentIntervalHook"
registers = ["r10"]

# Any aspect ratio without bars, with XenosNative (src/aspect.cpp): the 16:9 3D views are widened by
# xenos_native::AspectFactor() (their projection and culling frustum, built by sub_823288C8), the 2D views
# (HUD, menus, videos) are drawn in a 16:9 box in the middle, and 3D effects' screen rectangles are opened
# on the wider axis.
[[midasm_hook]]
address = 0x82328B84   # fmr f0,f1: perspective branch, f29 = tan(width / 2), f1 = tan(height / 2)
name = "PotcawePerspectiveAspectHook"
registers = ["f1", "f29"]
# The game's views for XenosNative (src/views.cpp): 2D views in the 16:9 box (D43), the 3D views' matrices
# and the start of their post-processing for DLAA (D47).
[[midasm_hook]]
address = 0x823B3E48   # bl 0x822b7848 in sub_823B3C38: the view's matrix to c0-c3, r5 = the matrix
name = "PotcaweViewHook"
registers = ["r5"]
[[midasm_hook]]
address = 0x823B6B20   # li r5,112 in sub_823B6290: the view's post-processing starts
name = "PotcawePostProcessingHook"
[[midasm_hook]]
address = 0x823F8838   # fmadds f12,f12,f0,f6 in sub_823F8750: a draw's screen rectangle, f12 f10 f11 f9
name = "PotcaweScissorAspectHook"
registers = ["f9", "f10", "f11", "f12"]

# No MSAA (src/msaa.cpp): the renderer creates its surfaces through sub_824D5750 (a wrapper of
# XGSetSurfaceHeader) from three functions; r6 is the multisample type. The hooks pass 0 when
# potcawe_no_msaa is on.
[[midasm_hook]]
address = 0x823FBF84   # bl sub_824D5750 in sub_823FBC90
name = "PotcaweMsaaHook"
registers = ["r6"]
[[midasm_hook]]
address = 0x823FC034   # bl sub_824D5750 in sub_823FBC90
name = "PotcaweMsaaHook"
registers = ["r6"]
[[midasm_hook]]
address = 0x823F9B48   # bl sub_824D5750 in sub_823F98D8
name = "PotcaweMsaaHook"
registers = ["r6"]
[[midasm_hook]]
address = 0x823F9BF4   # bl sub_824D5750 in sub_823F98D8
name = "PotcaweMsaaHook"
registers = ["r6"]
[[midasm_hook]]
address = 0x823F9394   # bl sub_824D5750 in sub_823F9058
name = "PotcaweMsaaHook"
registers = ["r6"]
[[midasm_hook]]
address = 0x823F9440   # bl sub_824D5750 in sub_823F9058
name = "PotcaweMsaaHook"
registers = ["r6"]
# The same renderer function computes how many EDRAM tiles the scene needs from the antialiasing
# level (2 at 1280x720 with 2x MSAA); one tile when potcawe_no_msaa is on.
[[midasm_hook]]
address = 0x823FBE20   # divwu r11,r23,r3 (after add r3,r10,r11 in sub_823FBC90)
name = "PotcaweTileCountHook"
registers = ["r3"]
[[midasm_hook]]
address = 0x823F99DC   # divwu r11,r23,r3 in sub_823F98D8
name = "PotcaweTileCountHook"
registers = ["r3"]
[[midasm_hook]]
address = 0x823F9228   # divwu r11,r23,r3 in sub_823F9058
name = "PotcaweTileCountHook"
registers = ["r3"]
# The sun flare (sub_824521F8) scales the samples its occlusion query should count by the
# antialiasing level; it sees level 0 when potcawe_no_msaa is on.
[[midasm_hook]]
address = 0x824522E4   # lis r11,-32256 (after bl sub_823B1E58 in sub_824521F8)
name = "PotcaweFlareAaLevelHook"
registers = ["r3"]

# Lua errors in the log (src/lua_errors.cpp): the game sets no panic function and prints nothing. One hook
# logs the errors its protected calls catch (luaD_pcall, sub_8247AB70); the other, an error nothing catches,
# before luaD_throw (sub_8247A5E0) calls exit(EXIT_FAILURE).
[[midasm_hook]]
address = 0x8247ABD0   # lwz r11,48(r31) (in luaD_pcall, after bl luaD_seterrorobj)
name = "PotcaweLuaCaughtErrorHook"
registers = ["r29", "r30"]
[[midasm_hook]]
address = 0x8247A61C   # stb r11,6(r31) (in luaD_throw, with no error handler: L->status = errcode)
name = "PotcaweLuaUnhandledErrorHook"
registers = ["r31", "r11"]
