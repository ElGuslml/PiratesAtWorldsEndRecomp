<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256">
  <!-- icon.svg simplified for 16-32 px: no compass points, ticks or small details; a bigger coin and skull. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/>
      <stop offset="0.45" stop-color="#d6a640"/>
      <stop offset="1" stop-color="#8a5a18"/>
    </linearGradient>
    <linearGradient id="goldPart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d888"/>
      <stop offset="1" stop-color="#b8842a"/>
    </linearGradient>
    <radialGradient id="sea" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2c5869"/>
      <stop offset="0.65" stop-color="#12303d"/>
      <stop offset="1" stop-color="#06141b"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e2d5b6"/>
    </linearGradient>

    <g id="cutlass">
      <path d="M -10,52 C -12,10 -11,-50 -5,-96 C 0,-106 14,-104 16,-90 C 19,-50 15,10 10,52 Z"
            fill="#e6ecf0" stroke="#1b1610" stroke-width="8" stroke-linejoin="round"/>
      <rect x="-9" y="62" width="18" height="34" rx="4" fill="#6a3218" stroke="#1b1610" stroke-width="8"/>
      <rect x="-28" y="50" width="56" height="18" rx="9" fill="url(#goldPart)" stroke="#1b1610" stroke-width="8"/>
    </g>
  </defs>

  <circle cx="128" cy="128" r="122" fill="url(#gold)" stroke="#3a2408" stroke-width="8"/>
  <circle cx="128" cy="128" r="100" fill="url(#sea)" stroke="#3a2408" stroke-width="8"/>

  <use xlink:href="#cutlass" transform="translate(128 128) rotate(-45)"/>
  <use xlink:href="#cutlass" transform="translate(128 128) scale(-1 1) rotate(-45)"/>

  <g transform="translate(128 114) scale(1.1) translate(-128 -116)">
    <path d="M 128,62 C 157,62 172,82 172,104 C 172,120 166,128 161,134 C 156,140 152,142 151,148
             L 151,162 Q 151,171 142,171 L 114,171 Q 105,171 105,162 L 105,148
             C 104,142 100,140 95,134 C 90,128 84,120 84,104 C 84,82 99,62 128,62 Z"
          fill="url(#bone)" stroke="#1b1610" stroke-width="6" stroke-linejoin="round"/>
    <g fill="#10232c">
      <path d="M 133,104 C 139,96 158,95 162,105 C 165,116 159,127 148,127 C 137,127 131,116 133,104 Z"/>
      <path d="M 123,104 C 117,96 98,95 94,105 C 91,116 97,127 108,127 C 119,127 125,116 123,104 Z"/>
      <path d="M 128,127 L 136,142 Q 128,146 120,142 Z"/>
    </g>
    <g stroke="#1b1610" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M 119,151 L 119,169 M 137,151 L 137,169"/>
    </g>
  </g>
</svg>
